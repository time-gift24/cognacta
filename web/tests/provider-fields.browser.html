<!doctype html>
<meta charset="utf-8" />
<title>Provider field validation regression check</title>
<!-- Run npm run dev, then open /tests/provider-fields.browser.html. No backend required. -->
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { ProviderSettings } from "/src/components/settings/provider-settings.tsx";
  import { createDemoProviders } from "/src/adapters/demo/providers.ts";
  import { createTestDependencies, withDependencies } from "/tests/support.tsx";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const root = createRoot(fixture);
  const providers = createDemoProviders().providers;
  const dependencies = createTestDependencies({ providers });
  const render = () => flushSync(() => root.render(withDependencies(
    React.createElement("div", { className: "p-6" }, React.createElement(ProviderSettings)),
    dependencies,
  )));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const wait = (ms = 0) => new Promise(resolve => setTimeout(resolve, ms));
  const until = async (condition, message) => {
    const deadline = performance.now() + 8000;
    while (!condition() && performance.now() < deadline) await wait(20);
    assert(condition(), message);
  };
  const visible = element => element && element.getClientRects().length && !element.closest('[inert], [hidden], [aria-hidden="true"]');
  const section = () => fixture.querySelector('[data-slot="provider-settings"]');
  const button = (label) => [...section().querySelectorAll("button")].find(element => visible(element) && (element.getAttribute("aria-label") === label || element.textContent.trim() === label));
  const click = element => { assert(element && !element.disabled, "Expected an enabled control"); flushSync(() => element.click()); };
  const input = label => [...section().querySelectorAll("input")].find(element => [...element.labels].some(labelElement => labelElement.textContent.trim() === label));
  const setInput = (label, value) => flushSync(() => {
    const element = input(label);
    assert(element, `Missing ${label}`);
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(element, value);
    element.dispatchEvent(new Event("input", { bubbles: true }));
  });
  const fieldError = text => until(() => section().textContent.includes(text), `Missing field error: ${text}`);
  const focused = label => document.activeElement === input(label);

  try {
    render();
    await until(() => button("添加 Provider"), "Provider settings must load");
    click(button("添加 Provider"));
    click(button("保存 Provider"));
    await fieldError("Provider 名称须为 1–64 个字符");
    assert(input("名称").getAttribute("aria-invalid") === "true", "Name error must mark the input invalid");
    assert(input("名称").getAttribute("aria-describedby")?.includes("-error"), "Name error must be described by the input");
    await until(() => focused("名称"), "Submit must focus the first invalid field");

    setInput("名称", "字段接入");
    setInput("接入地址", "not a url");
    click(button("保存 Provider"));
    await fieldError("请输入有效的 HTTP／HTTPS 接入地址");
    assert(input("接入地址").getAttribute("aria-invalid") === "true", "URL error must mark the input invalid");
    await until(() => focused("接入地址"), "Submit must move focus to the next invalid field");
    await until(() => !section().textContent.includes("Provider 名称须为"), "Editing must clear the previous field error");

    setInput("接入地址", "https://fields.example/v1");
    setInput("模型 1", "same");
    click(button("添加模型"));
    setInput("模型 2", "same");
    click(button("保存 Provider"));
    await fieldError("同一 Provider 的模型名称不能重复");
    assert(input("模型 1").getAttribute("aria-invalid") === "true", "Model error must mark the first model input invalid");
    await until(() => focused("模型 1"), "Submit must focus the first invalid model field");

    setInput("模型 2", "other");
    await until(() => !section().textContent.includes("模型名称不能重复"), "Editing a model must clear its field error");
    click(button("保存 Provider"));
    await until(() => fixture.textContent.includes("Provider 已保存"), "Valid draft must save");

    click(section().querySelector('input[type="radio"][value="replace"]'));
    click(button("保存 Provider"));
    await fieldError("请输入新的 API Key");
    await until(() => document.activeElement === input("新的 API Key"), "Submit must focus a missing API key");
    assert(input("新的 API Key").getAttribute("aria-invalid") === "true", "Key error must mark the key input invalid");
    setInput("新的 API Key", "fixture-secret");
    await until(() => !section().textContent.includes("请输入新的 API Key"), "Typing a key must clear its field error");
    click(button("保存 Provider"));
    await until(() => section().textContent.includes("API Key 已配置"), "Key replacement must save");

    result.textContent = "PASS: provider validation names each field, marks aria-invalid, focuses the first error, and clears errors while editing";
    result.dataset.passed = "true";
  } catch (error) {
    result.textContent = `FAIL: ${error.message}`;
    result.dataset.passed = "false";
    throw error;
  }
</script>
